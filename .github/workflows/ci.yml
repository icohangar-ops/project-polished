# Checks that pass on the current tree.
# Left out: tsc (examples/websocket imports socket.io, which is not installed)
# and tests/python-runtime-container.sh (needs Docker and a runner image that is not published).

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Install, build, and tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build
        run: bun run build

      - name: Database runtime build tests
        run: bash tests/database-runtime-build.sh

      - name: Python runtime build tests
        run: bash tests/python-runtime-build.sh
